name: Synthetic memory tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - run: npm test
      - run: npm run preview:synthetic
      - name: Install pinned type-check tools in disposable cloud runner
        run: npm install --no-save --ignore-scripts --package-lock=false typescript@5.9.3 @types/node@22.19.0
      - name: Strict TypeScript check
        run: ./node_modules/.bin/tsc --noEmit --strict --target es2022 --module nodenext --allowImportingTsExtensions src/*.ts test/*.ts test/helpers/*.ts
